<!--{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <div class="md:col-span-2">
        </div>

    <div class="md:col-span-1">
        <div class="bg-white rounded-xl shadow-lg p-6 sticky top-6 border border-gray-200">
            
            <div class="text-center mb-6 p-4 bg-gray-50 rounded-lg">
                <p class="text-sm text-gray-500 uppercase tracking-wide font-bold">Time Remaining</p>
                <div id="countdown-timer" class="text-3xl font-mono font-bold text-red-600 mt-1">
                    Loading...
                </div>
            </div>

            <div class="text-center mb-6">
                <div class="text-4xl font-extrabold text-blue-600 my-2">
                    $<span id="current-price">{{ auction.current_price }}</span>
                </div>
                </div>

            <div class="mt-8 border-t pt-4">
                <h4 class="text-sm font-semibold text-gray-700 mb-2">Recent Bids</h4>
                <div id="bid-history" class="h-40 overflow-y-auto space-y-2 pr-2 text-sm">
                    {% for bid in previous_bids %}
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                        <span class="font-medium text-gray-700">{{ bid.user.username }}</span>
                        <span class="font-bold text-blue-600">${{ bid.amount }}</span>
                    </div>
                    {% endfor %}
                </div>
            </div>

        </div>
    </div>
</div>

<div id="outbid-popup" class="fixed bottom-5 right-5 bg-red-600 text-white px-6 py-4 rounded-lg shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center">
    <i class="fas fa-exclamation-triangle text-2xl mr-4"></i>
    <div>
        <h4 class="font-bold text-lg">You've been outbid!</h4>
        <p class="text-sm text-red-100">Place a new bid to reclaim the lead.</p>
    </div>
    <button onclick="hidePopup()" class="ml-4 text-red-200 hover:text-white"><i class="fas fa-times"></i></button>
</div>

<script>
    // --- CONFIGURATION ---
    const roomName = "{{ room_name }}";
    // Parse the end time securely from Django
    let endTime = new Date("{{ auction.end_time.isoformat }}").getTime();
    const bidHistory = document.getElementById('bid-history');
    
    // --- WEBSOCKET CONNECTION ---
    const chatSocket = new WebSocket(
        'ws://' + window.location.host + '/ws/auction/' + roomName + '/'
    );

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        
        // CASE A: NEW BID (Public)
        if (data.type === 'notification' && data.notification_type === 'outbid') {
            showOutbidPopup();
        } 
        else if (data.new_price) {
            // 1. Update Price
            document.querySelector('#current-price').innerText = data.new_price;
            
            // 2. Add to History List (Animation)
            const newEntry = document.createElement('div');
            newEntry.className = "flex justify-between items-center bg-green-50 p-2 rounded border border-green-200 animate-pulse";
            newEntry.innerHTML = `
                <span class="font-medium text-gray-900">${data.bidder_name || 'Someone'}</span>
                <span class="font-bold text-green-700">$${data.new_price}</span>
            `;
            
            // Add to top and scroll to top
            bidHistory.prepend(newEntry);
            if(bidHistory.children.length > 5) bidHistory.lastElementChild.remove();
        }
    };

    // --- TIMER LOGIC ---
    const timerElem = document.getElementById('countdown-timer');
    
    function updateTimer() {
        const now = new Date().getTime();
        const distance = endTime - now;

        if (distance < 0) {
            timerElem.innerHTML = "EXPIRED";
            timerElem.classList.replace("text-red-600", "text-gray-500");
            document.querySelector("button").disabled = true; // Disable bid button
            document.querySelector("button").classList.add("bg-gray-400", "cursor-not-allowed");
            return;
        }

        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Format: 00:05:23
        timerElem.innerHTML = 
            (hours < 10 ? "0" + hours : hours) + ":" + 
            (minutes < 10 ? "0" + minutes : minutes) + ":" + 
            (seconds < 10 ? "0" + seconds : seconds);
    }

    // Run timer immediately and then every second
    updateTimer();
    setInterval(updateTimer, 1000);

    // --- POPUP LOGIC ---
    function showOutbidPopup() {
        const popup = document.getElementById('outbid-popup');
        popup.classList.remove('translate-y-20', 'opacity-0');
        // Auto hide after 5 seconds
        setTimeout(hidePopup, 5000);
    }

    function hidePopup() {
        const popup = document.getElementById('outbid-popup');
        popup.classList.add('translate-y-20', 'opacity-0');
    }
</script>
