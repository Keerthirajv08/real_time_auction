

services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 base.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    env_file:
      - .env

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"

  celery_worker:
    build: .
    command: celery -A base worker -l info -P eventlet
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file: .env

  celery_beat:
    build: .
    command: celery -A base beat -l info -P eventlet
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file: .env

volumes:
  postgres_data:
  static_volume:
  media_volume:

  

